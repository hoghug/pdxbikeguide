<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - PDX Bike Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f1ed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 100%;
            height: auto;
            max-height: 300px;
        }

        .coming-soon {
            font-size: 32px;
            color: #1a1a1a;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .coming-soon {
                font-size: 24px;
            }

            .logo img {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="pdx-logo.jpeg" alt="PDX Bike Guide Logo">
        </div>
        <div class="coming-soon">Coming Soon</div>
    </div>
</body>
</html>
